name: Bug report
description: Report a reproducible problem in this community fork.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report vulnerabilities through [private security reporting](https://github.com/sep1ol/relaycrew/security/advisories/new).
        Use synthetic examples. Do not include tokens, member keys, real configuration files, private account details, prompts, request logs, or certificate private keys.
  - type: textarea
    id: versions
    attributes:
      label: Versions and environment
      description: Include the TeamClaude version or commit, Node.js version, operating system, and relevant client and provider names. Do not include account details.
      placeholder: |
        TeamClaude commit or version:
        Node.js version:
        Operating system:
        Client and version:
        Provider:
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest example that reproduces the problem. Use synthetic configuration and data. Note whether team mode is enabled.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include a sanitized error message if useful.
    validations:
      required: true
